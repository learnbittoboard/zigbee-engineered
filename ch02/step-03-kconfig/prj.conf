# Chapter 2, Step 3 — configuration.
# prj.conf SETS options; ./Kconfig (this app's own file) DEFINES the
# ROOM_* ones. Read both files together — that pairing is the lesson.

CONFIG_LOG=y
CONFIG_MAIN_STACK_SIZE=2048

# Override the Kconfig default (1000 ms) WITHOUT touching C or the
# Kconfig file. Same source, faster heartbeat, purely by config.
CONFIG_ROOM_BLINK_PERIOD_MS=250

# The heartbeat feature stays ON (its Kconfig default). Setting
# CONFIG_ROOM_FEATURE_HEARTBEAT_LOG=n here would compile the
# heartbeat code out of the image entirely — try it (README).

# Per-module log levels: the whole app is INF, but the sensor_sim
# module ("sim") is raised to DBG. One line, one module, no global
# noise. This is how real products keep one suspect subsystem loud
# while everything else whispers.
CONFIG_SIM_LOG_LEVEL_DBG=y
