# Chapter 2, Step 2 — configuration.
# GPIO is a driver: like every driver in Zephyr it is switched on
# here, in prj.conf, not in C.

CONFIG_LOG=y
CONFIG_MAIN_STACK_SIZE=2048

# The GPIO driver. Without it, gpio_dt_spec structs still compile,
# but the device behind them does not exist at runtime.
CONFIG_GPIO=y
