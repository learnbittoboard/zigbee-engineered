# Chapter 1, Step 1 — configuration.
# prj.conf is where a Zephyr application turns features on and off.
# (Chapter 2 explains how this file really works — for now, just notice
# that ONE line below enables the whole logging system.)

# Turn on the logging module. Without this line, every LOG_* call in
# main.c compiles to nothing.
CONFIG_LOG=y

# Give main() a little extra stack: log formatting is stack-hungry.
CONFIG_MAIN_STACK_SIZE=2048
