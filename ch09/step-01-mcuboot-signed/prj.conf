#
# Chapter 8, Step 2 — binding & actuation.
# Configuration is Step 1's, plus one product knob that lives in
# this app's Kconfig (see Kconfig): OCCUPANCY_OFF_DELAY_SEC, the
# no-presence hold time before the bulb is switched off. It takes
# its default (30 s) from Kconfig; a build overrides it here:
#     CONFIG_OCCUPANCY_OFF_DELAY_SEC=120
#

CONFIG_NCS_SAMPLES_DEFAULTS=y

# Serial console (the DK's USB UART) for logs.
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_SERIAL=y
CONFIG_GPIO=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_MAIN_THREAD_PRIORITY=7

# The Zigbee R23 add-on itself, the application utilities, and
# this device's role: ROUTER.
CONFIG_ZIGBEE_ADD_ON=y
CONFIG_ZIGBEE_APP_UTILS=y
CONFIG_ZIGBEE_ROLE_ROUTER=y

# Enable DK LED and Buttons library
CONFIG_DK_LIBRARY=y

# This example requires more workqueue stack
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# --- Chapter 4's driver, riding along ------------------------------
# The LD2410 receive path: interrupt-driven UART into a ring
# buffer, parser thread behind it (src/ld2410.c, unchanged).
CONFIG_RING_BUFFER=y

# The driver's own log module stays at INF: startup and resync
# warnings only. (The symbol exists because this app's Kconfig
# instantiates the log template for the LD2410 module name.)
CONFIG_LD2410_LOG_LEVEL_INF=y

# The `presence` shell command (src/main.c): live reading, driver
# counters, and the attribute the network can read.
CONFIG_SHELL=y

# --- Chapter 9: the signed image and the cable-DFU door ------------
#
# The version the BOOTLOADER AND THE OTA WORLD see. imgtool
# stamps it into the signed image header; it is deliberately a
# separate knob from the VERSION file (which feeds the app's
# own APP_VERSION_STRING log line) — the two must agree, and
# this chapter's lesson is about what breaks when they don't.
# Chapter 10 reuses this exact value as the Zigbee OTA file
# version.
CONFIG_MCUBOOT_IMGTOOL_SIGN_VERSION="1.0.0"

# The cable update path: an mcumgr SMP server on the console
# UART (the board overlay points zephyr,uart-mcumgr at uart0).
# Steps 2–3 of this chapter push signed images through it with
# the mcumgr CLI (image upload / test / list). A shipping
# product would gate this door or compile it out — Chapter 9's
# lesson says so out loud; the lab keeps it because it is also
# the window that lets you WATCH the slot states (test,
# pending, confirmed) while rollback happens.
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_UART=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
# mcumgr's own dependencies are NOT selected by anything in the
# Zigbee configuration — assign them or Kconfig silently drops
# the whole subsystem (it did exactly that on this step's first
# build; the warning is in the log and the absence is in the
# built .config — check .config, not prj.conf, Chapter 2's
# rule). NET_BUF + ZCBOR are mcumgr's deps; BASE64 + CRC +
# UART_MCUMGR are the UART transport's.
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_BASE64=y
CONFIG_CRC=y
CONFIG_UART_MCUMGR=y

# The image manager is how mcumgr writes the secondary slot —
# which lives in the DK's external QSPI flash, so the app
# needs the QSPI NOR driver too (the bootloader has its own
# copy, configured under sysbuild/mcuboot/).
CONFIG_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NORDIC_QSPI_NOR=y
CONFIG_NORDIC_QSPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
CONFIG_IMG_ERASE_PROGRESSIVELY=y
