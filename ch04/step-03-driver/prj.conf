# Chapter 4, Step 3 — configuration. Same receive path as Steps 1–2.

CONFIG_LOG=y
CONFIG_MAIN_STACK_SIZE=2048

CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y

# The driver's own log module (LD2410) stays at INF here: startup and
# resync warnings only. Flip this one line to
#   CONFIG_LD2410_LOG_LEVEL_DBG=y
# and the driver narrates every parsed frame — per-module levels
# (Chapter 2, Step 3) aimed at exactly one subsystem. The symbol
# exists because this app's Kconfig instantiates the log template
# for the LD2410 module name.
CONFIG_LD2410_LOG_LEVEL_INF=y

# The Zephyr shell, Chapter 1's tool, now pointed at a real driver:
# the app's `presence` command (src/main.c) reads the driver live.
# The shell backend shares the USB serial port with the log output.
CONFIG_SHELL=y
