# Chapter 1, Step 2 — configuration.
# Same logging as Step 1, plus the Zephyr shell on the serial port.

CONFIG_LOG=y
CONFIG_MAIN_STACK_SIZE=2048

# The shell: an interactive command line living on the board.
# The serial backend is the default — it shares the USB serial port
# with the log output (read the README note about that).
CONFIG_SHELL=y
