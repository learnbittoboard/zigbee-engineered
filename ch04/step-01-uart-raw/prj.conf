# Chapter 4, Step 1 — configuration.

CONFIG_LOG=y
CONFIG_MAIN_STACK_SIZE=4096

# The serial subsystem and the interrupt-driven (FIFO) UART API —
# the classic uart_irq_* / uart_fifo_read interface this chapter
# is built on. (Zephyr also has a callback-based async API; a
# datasheet frame parser over a byte stream is the interrupt
# API's home turf, and the shape matches Chapter 2's ISR rule.)
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# The ISR-safe byte ring buffer between the UART interrupt and
# the thread that prints. Part of the kernel's data structures.
CONFIG_RING_BUFFER=y
