#
# Chapter 6, Step 1 — occupancy-sensor router skeleton.
# Configuration follows the Zigbee add-on's "template" sample; every
# line here is load-bearing for a ZBOSS router build, so the comments
# say what each one buys us.
#

CONFIG_NCS_SAMPLES_DEFAULTS=y

# Serial console (the DK's USB UART) for logs.
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_SERIAL=y
CONFIG_GPIO=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_MAIN_THREAD_PRIORITY=7

# The Zigbee R23 add-on itself, the application utilities (default
# signal handler = our commissioning engine, factory-reset button
# helper, network-state LED helper), and this device's role: ROUTER.
# A router is mains-powered, always awake, and relays for others —
# exactly what a ceiling occupancy sensor on wall power should be.
CONFIG_ZIGBEE_ADD_ON=y
CONFIG_ZIGBEE_APP_UTILS=y
CONFIG_ZIGBEE_ROLE_ROUTER=y

# Enable DK LED and Buttons library
CONFIG_DK_LIBRARY=y

# This example requires more workqueue stack
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
